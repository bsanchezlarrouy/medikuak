<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medikuak</title>
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medikuak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE: tranquila y clara, como una libreta de casa bien ordenada; sin alarmas salvo lo que pide acción.
   IDEA: la carpeta de papeles médicos de la familia, convertida en app de bolsillo.
   PICTURE: la propia app funcionando, con fichas que suben desde abajo.
   COLOUR and TYPE: papel cálido, tinta azul pizarra, ámbar solo para lo atrasado. Atkinson Hyperlegible, grande.
   LAYOUT: una columna de móvil, pestañas abajo, botón + flotante, hojas apiladas. */
:root{color-scheme:light dark;
--bg:light-dark(#F6F4EF,#121619);--card:light-dark(#FFFFFF,#1C2227);--ink:light-dark(#18212B,#ECEFF1);
--mute:light-dark(#545E69,#A9B3BC);--line:light-dark(#E2DED5,#2E363D);--acc:light-dark(#1D5C86,#8CC4EC);
--accbg:light-dark(#E3EEF6,#173A52);--warn:light-dark(#8A4B00,#F3C27F);--warnbg:light-dark(#FBEBD3,#3B2A12);
--warnln:light-dark(#E9C38E,#6A4A1E);--chip:light-dark(#ECEAE4,#262D33);--btn:light-dark(#18212B,#ECEFF1);
--btnink:light-dark(#FFFFFF,#121619);--err:light-dark(#A32D2D,#F2A3A3);--ok:light-dark(#2F5D3A,#A6D8B0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:110px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 18px 8px}
.top h1{margin:0;font-size:30px;line-height:1.1}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:32px;padding:4px 12px;border-radius:999px;border:0;background:var(--chip);color:var(--mute);font-size:14px}
.sync i{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.sync.ok i{background:var(--ok)}.sync.warn{background:var(--warnbg);color:var(--warn)}.sync.acc{background:var(--accbg);color:var(--acc)}.sync.err{color:var(--err)}
.banner{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accbg);color:var(--acc);font-size:15px}
.pf{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}
.pill{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.pill.on,.pill[aria-pressed=true]{border:1.5px solid var(--acc);background:var(--accbg);color:var(--acc);font-weight:700}
main{padding:0 18px;display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
h2,h3{margin:0}h3{font-size:18px}
.sec>h3{display:flex;align-items:center;gap:8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:14px;align-items:center;width:100%;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.list>:last-child{border-bottom:0}
.when{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.when small{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase}.when b{font-size:23px}
.when.h b{font-size:18px}
.txt{flex:1;display:flex;flex-direction:column;gap:2px}
.t{font-weight:700}.s{color:var(--mute);font-size:15px}
.tag{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--mute)}
.top .sync+.sync{margin-left:6px}
.lockb{display:inline-flex;vertical-align:-2px;color:var(--mute);margin-left:4px}
.tag.tv{background:var(--accbg);color:var(--acc)}.tag.tu{background:light-dark(#F7E2E2,#3F2222);color:light-dark(#8A2F2F,#F2B0B0)}.tag.ti{background:light-dark(#EEE7F6,#2E2944);color:light-dark(#5A3F8A,#C8BEF0)}.tag.ta{background:light-dark(#E2EFE6,#1D3326);color:light-dark(#2F5D3A,#A6D8B0)}
.rl{display:flex;margin-top:4px}
.red{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 2px;border-radius:8px;background:var(--rb);color:var(--ri);font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap}
.red b,.red img{width:22px;height:22px;border-radius:6px;flex:none}
.red b{display:inline-flex;align-items:center;justify-content:center;background:var(--ri);color:var(--card);font-size:12px}
.red img{object-fit:contain;background:#fff;padding:1px}
.red.big{font-size:15px;padding:3px 12px 3px 3px;border-radius:10px}.red.big b,.red.big img{width:30px;height:30px;border-radius:8px}
.r1{--rb:light-dark(#E2EFE6,#1D3326);--ri:light-dark(#2F5D3A,#A6D8B0)}.r2{--rb:light-dark(#E3EEF6,#173A52);--ri:light-dark(#1D5C86,#8CC4EC)}
.r3{--rb:light-dark(#F7E2E2,#3F2222);--ri:light-dark(#8A2F2F,#F2B0B0)}.r4{--rb:light-dark(#EEE7F6,#2E2944);--ri:light-dark(#5A3F8A,#C8BEF0)}.r0{--rb:var(--chip);--ri:var(--mute)}
.logoprev{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.alert{background:var(--warnbg);border:1px solid var(--warnln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ah{display:flex;gap:10px;align-items:flex-start;color:var(--warn)}.ah .s{color:var(--warn)}.ah p{margin:0}.ah .t{color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1 1 140px}
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 14px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;text-align:center}
.b1{border:0;background:var(--btn);color:var(--btnink)}
.b2{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.warnb{background:var(--warn);color:var(--btnink)}
.tel span{display:flex;flex-direction:column;line-height:1.15;text-align:left}.tel small{font-weight:400;font-size:13px;white-space:nowrap}
.danger{color:var(--err);border-color:currentColor}
.chk{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.chk>span{display:flex;flex-direction:column;gap:2px}
.empty{margin:0;padding:14px 16px;color:var(--mute);font-size:15px}
.card{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;text-decoration:none;color:var(--ink)}
.card p{margin:0}
.next{display:flex;gap:8px;align-items:center;margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--accbg);font-size:15px}
.next.late{background:var(--warnbg);color:var(--warn)}.next.soft{background:var(--chip)}
.av{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--a);color:var(--ai)}
.h1{--a:light-dark(#D9E7F2,#1E3A50);--ai:light-dark(#1D5C86,#9CCBEE)}.h2{--a:light-dark(#F6E3CC,#43301A);--ai:light-dark(#8A4B00,#F3C27F)}
.h3{--a:light-dark(#E4E0F0,#2E2944);--ai:light-dark(#4B3F7A,#C8BEF0)}.h4{--a:light-dark(#DCEBDF,#1F3324);--ai:light-dark(#2F5D3A,#A6D8B0)}
.h5{--a:light-dark(#F5DEDE,#432222);--ai:light-dark(#7A2E2E,#F2B0B0)}.h0{--a:var(--chip);--ai:var(--mute)}
.who{display:flex;gap:14px;align-items:center}
.add{min-height:46px;border-radius:12px;border:1px dashed light-dark(#A9A293,#56606A);background:none;color:var(--acc);font-weight:700;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.grid4 .gbtn{min-height:74px;padding:6px 4px;font-size:13px;text-align:center;line-height:1.2;hyphens:manual}
.gbtn{min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:var(--ink)}
.gbtn svg{color:var(--acc)}
.hist{display:flex;flex-direction:column}
.hi{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:0}
.rail{width:14px;flex:none;display:flex;flex-direction:column;align-items:center}
.rail i{width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:6px}.rail b{flex:1;width:2px;background:var(--line);margin-top:4px}
.rail i.m{background:var(--mute)}a.hi{color:var(--ink);text-decoration:none}
.rail i.o{background:none;border:2px solid var(--mute)}
.hb{flex:1;display:flex;flex-direction:column;gap:5px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.hb.plain{border:0;background:none;padding:2px 0 10px}
.q{font-size:15px;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--chip);color:var(--mute)}
.li{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);text-decoration:none}
.li p{margin:0}.li>svg{flex:none;margin-top:2px;color:var(--mute)}.li>div{flex:1}
.kv{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px 12px;margin:0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.kv dt{color:var(--mute);font-size:15px}.kv dd{margin:0}
.kv button{border:0;background:none;padding:0;color:var(--acc);font-weight:700;text-align:left;min-height:28px}
.meta{font-size:14px;color:var(--mute);margin:0}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--mute)}
.st .c{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center}
.st.done{color:var(--acc)}.st.done .c{background:var(--acc);border-color:var(--acc);color:var(--btnink)}
.st.cur{border:2px solid var(--acc);background:var(--accbg);color:var(--acc);font-weight:700}
.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.f input,.f select,.f textarea,.inp{width:100%;min-height:50px;padding:10px 12px;border-radius:12px;border:1px solid light-dark(#C9C3B6,#46505A);background:var(--card);font-size:16px;font-weight:400}
.f textarea{resize:vertical;line-height:1.4}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:14px;background:var(--chip)}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;font-size:15px;color:var(--mute)}
.seg button[aria-checked=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fixed{margin:0;padding:12px 14px;border-radius:12px;background:var(--chip);font-weight:700}
.hint{margin:0;font-size:14px;color:var(--mute);font-weight:400}
.ferr{margin:0;color:var(--err);font-size:15px;font-weight:700}
.foot{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:25;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tabs button{min-height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--mute)}
.tabs button[aria-current=page]{color:var(--acc);font-weight:700}
.fab{position:fixed;z-index:26;bottom:calc(84px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));width:60px;height:60px;border-radius:18px;border:0;background:var(--btn);color:var(--btnink);box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.42)}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.in{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,40%);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.in{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.sh{display:flex;align-items:flex-start;gap:8px}.sh h2{flex:1;font-size:25px;line-height:1.15;padding-top:4px}
.sh .k{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:2px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
#toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--btn);color:var(--btnink);box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast[hidden]{display:none}#toast span{flex:1}
#toast button{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:light-dark(#9CCBEE,#1D5C86);font-weight:700}
#ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
#ov[hidden]{display:none}
.onb{max-width:440px;margin:0 auto;min-height:100%;padding:48px 24px 32px;display:flex;flex-direction:column;gap:20px}
.onb h2{font-size:clamp(30px,8vw,38px);line-height:1.08;text-wrap:balance}
.onb p{margin:0}
.mark{width:84px;height:84px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ticks li{display:flex;gap:12px;align-items:flex-start}.ticks svg{flex:none;color:var(--ok);margin-top:1px}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:left}
.choice svg{flex:none;color:var(--acc)}
.small{font-size:14px;color:var(--mute)}
.acct{display:flex;gap:14px;align-items:center;width:100%;min-height:64px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.qrimg{background:#fff;padding:12px;border-radius:14px;line-height:0;min-height:60px;display:flex;align-items:center;justify-content:center}.qrimg svg{width:220px;height:220px;display:block}.qrimg .small{line-height:1.4}
.ferr+.b2,.onb .b2{min-height:46px}
.code{display:block;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.sw span{flex:1}
.sw i{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked=true] i{background:var(--acc)}.sw[aria-checked=true] i::after{left:21px}
.sim{padding:14px;border-radius:18px;border:1.5px dashed light-dark(#B9B2A4,#56606A)}
.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.note{margin:0 auto;padding:22px 18px 0;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <div id="pf"></div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" data-a="nuevo" aria-label="Añadir"></button>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div id="sheets"></div>
<div id="ov" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const HOY=iso(0),YEAR=HOY.slice(0,4);
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'],MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dt=s=>new Date(s+'T12:00');
const fshort=s=>{if(!s)return'';const d=dt(s);return `${d.getDate()} ${MES[d.getMonth()]}${s.slice(0,4)!==YEAR?' '+s.slice(0,4):''}`};
const fdate=s=>{if(!s)return'';const d=dt(s);return `${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`};
const fmonth=s=>{const d=dt(s);return `${MESL[d.getMonth()]}${s.slice(0,4)!==YEAR?' de '+s.slice(0,4):''}`};
const rel=s=>{const n=Math.round((dt(s)-dt(HOY))/864e5);return n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>0?`en ${n} días`:`hace ${-n} días`};
const hace=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<10?'ahora mismo':s<60?`hace ${s} s`:s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`};
const uid=()=>Math.random().toString(36).slice(2,10);
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

const I={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
fam:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
med:'<path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>',

let idb=null;
function openIDB(){return new Promise(res=>{try{const r=indexedDB.open('medikuak',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{if(!idb)return res(null);try{const t=idb.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(k,v){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}

const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,salt,iter=150000){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256));
}
async function pinOk(pin){const r=pinRec();if(!r)return false;const [,it,sa,h]=String(r.valor).split('$');try{return await pinHash(pin,unb64(sa),+it)===h}catch(e){return false}}

/* ---------- entrar con Google (OAuth en el navegador, sin servidor) ---------- */
const tokenOk=()=>!!(auth&&auth.token&&auth.exp>Date.now()+60000);
const linked=()=>!!(auth&&auth.email&&C.sheetId);
function signIn(mode){
  if(!configured()){toast('Falta el ID de cliente de Google en config.js.');return}
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem(LS('oauth-state'),st)}catch(e){}
  const p=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:SCOPES,include_granted_scopes:'true',state:st});
  if(mode==='none')p.set('prompt','none');else if(mode==='select')p.set('prompt','select_account');
  if(mode!=='select'&&auth&&auth.email)p.set('login_hint',auth.email);
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p.toString();
}
async function handleOAuthReturn(){
  if(!/(^#|&)(access_token|error)=/.test(location.hash))return null;
  const q=new URLSearchParams(location.hash.slice(1));
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
  let st=null;try{st=localStorage.getItem(LS('oauth-state'));localStorage.removeItem(LS('oauth-state'))}catch(e){}
  if(!st||q.get('state')!==st)return {error:'state'};
  if(q.get('error'))return {error:q.get('error')};
  const token=q.get('access_token'),exp=Date.now()+(parseInt(q.get('expires_in'),10)||3600)*1000;
  let info={};
  try{const r=await fetch('https://openidconnect.googleapis.com/v1/userinfo',{headers:{Authorization:'Bearer '+token}});if(r.ok)info=await r.json()}catch(e){}
  const changed=auth&&auth.email&&info.email&&auth.email!==info.email;
  auth={token,exp,email:info.email||(auth&&auth.email)||'',name:info.given_name||info.name||(auth&&auth.name)||''};
  jset('google',auth);
  if(changed){remoteRows={};C.lector=false;S.sheetState='';saveC()}
  return {ok:true,changed};
}

/* ---------- Google Sheets ---------- */
class ApiError extends Error{constructor(status,msg,write){super(msg);this.status=status;this.write=!!write}}
function apiMsg(status,write){
  if(status===401)return 'La sesión de Google ha caducado. Toca para entrar de nuevo.';
  if(status===403)return write?'Tu cuenta solo puede ver la hoja (Lector).':'Tu cuenta ('+((auth&&auth.email)||'')+') no puede abrir esta hoja.';
  if(status===404)return 'Tu cuenta no puede abrir esta hoja, o todavía no la ha elegido en su Drive.';
  if(status===0)return navigator.onLine===false?'Sin conexión: se guardará en Google cuando vuelva internet.':'No se ha podido conectar con Google.';
  return 'Google ha respondido con un error ('+status+').';
}
async function api(url,{method='GET',body}={},write=false){
  if(!tokenOk())throw new ApiError(401,apiMsg(401));
  let r;
  try{r=await fetch(url,{method,headers:Object.assign({Authorization:'Bearer '+auth.token},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store'})}
  catch(e){throw new ApiError(0,apiMsg(0))}
  if(r.status===401){auth.exp=0;jset('google',auth)}
  if(!r.ok)throw new ApiError(r.status,apiMsg(r.status,write),write);
  return r.status===204?null:r.json();
}
const SHEETS='https://sheets.googleapis.com/v4/spreadsheets/';
const rng=s=>encodeURIComponent(s);
const COLS=k=>['id'].concat(TABLAS[k][1].map(f=>f[1]),['Actualizado','Por','Borrado']);
const range=(k,n)=>`${TABLAS[k][0]}!A1:${String.fromCharCode(64+COLS(k).length)}${n||''}`;
const toISO=ms=>ms?new Date(ms).toISOString():'';
const fromISO=v=>{if(typeof v==='number')return v;const t=Date.parse(v||'');return isNaN(t)?0:t};
const yes=v=>v===true||/^(true|verdadero|s[ií]|x|1)$/i.test(String(v??'').trim());
/* si alguien edita una fecha a mano en la hoja, Google la devuelve como número de serie */
const fromDate=v=>typeof v==='number'&&v>20000&&v<80000?new Date(Date.UTC(1899,11,30)+v*864e5).toISOString().slice(0,10):String(v??'').trim();
function toRow(k,x){
  const f=TABLAS[k][1];
  if(x.borrado)return [x.id,...f.map(()=>''),toISO(x.act),x.por||'','sí'];
  return [x.id,...f.map(([n,,t])=>t==='b'?(x[n]?'sí':''):t==='n'?(Number(x[n])||0):String(x[n]??'')),toISO(x.act),x.por||'',''];
}
/* idx[i] = posición en la hoja de la columna i de COLS(k), buscada por su título */
function headerIndex(k,head){const cols=COLS(k),h=(head||[]).map(x=>String(x).trim());return h[0]==='id'?cols.map(c=>h.indexOf(c)):cols.map((c,i)=>i)}
function fromRow(k,r,idx){
  const f=TABLAS[k][1],n=f.length,g=i=>{const j=idx?idx[i]:i;return j>=0?(r[j]??''):''};
  const id=String(g(0)).trim();if(!id||id==='id')return null;
  const act=fromISO(g(n+1)),por=String(g(n+2));
  if(yes(g(n+3)))return {id,act,por,borrado:act||Date.now()};
  const o={id,act,por};
  f.forEach(([key,,t],i)=>{const v=g(i+1);o[key]=t==='b'?yes(v):t==='n'?(Number(v)||0):t==='d'?fromDate(v):String(v)});
  return o;
}
let remoteRows={};
async function pull(){
  const j=await api(SHEETS+C.sheetId+'/values:batchGet?'+KEYS.map(k=>'ranges='+rng(range(k))).join('&')+'&valueRenderOption=UNFORMATTED_VALUE');
  const out=empty();
  ((j&&j.valueRanges)||[]).forEach((vr,i)=>{const k=KEYS[i],rows=vr.values||[];remoteRows[k]=rows.length;const m=new Map();
    const idx=headerIndex(k,rows[0]);rows.slice(1).forEach(r=>{const x=fromRow(k,r,idx);if(x&&(!m.has(x.id)||x.act>=m.get(x.id).act))m.set(x.id,x)});out[k]=[...m.values()]});
  return out;
}
const sig=(k,a)=>JSON.stringify(a.slice().sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0).map(x=>toRow(k,x)));
/* gana el cambio más reciente de cada registro */
function merge(remote,local){
  const out=empty();
  for(const k of KEYS){const m=new Map(remote[k].map(x=>[x.id,x]));
    for(const x of local[k]){const r=m.get(x.id);if(!r||(x.act||0)>(r.act||0))m.set(x.id,x)}
    out[k]=[...m.values()]}
  prune(out);return out;
}
async function pushRemote(o,remote){
  const data=[];
  for(const k of KEYS){
    if(sig(k,o[k])===sig(k,remote[k]))continue;
    const rows=[COLS(k)].concat(o[k].filter(x=>!x.borrado).concat(o[k].filter(x=>x.borrado)).map(x=>toRow(k,x)));
    const n=rows.length;while(rows.length<(remoteRows[k]||0))rows.push(COLS(k).map(()=>''));
    data.push({range:range(k,rows.length),values:rows});remoteRows[k]=n;
  }
  if(!data.length)return false;
  await api(SHEETS+C.sheetId+'/values:batchUpdate',{method:'POST',body:{valueInputOption:'RAW',data}},true);
  return true;
}
let syncT=null,syncAgain=false;
function scheduleSync(ms=1200){if(!linked())return;clearTimeout(syncT);syncT=setTimeout(sync,ms)}
async function sync(){
  if(!linked()||!tokenOk()||S.sheetState==='denied'){renderTop();return}
  if(S.syncing){syncAgain=true;return}
  S.syncing=true;renderTop();
  try{
    let remote;try{remote=await pull()}catch(e){if(e.status!==400)throw e;await ensureTabs(C.sheetId);remote=await pull()}
    let merged=C.lector?(prune(remote),remote):merge(remote,D);
    const changed=KEYS.some(k=>sig(k,merged[k])!==sig(k,D[k]));
    D=merged;if(changed){save();render()}
    if(!C.lector){
      try{if(await pushRemote(D,remote))setTimeout(()=>scheduleSync(0),4000)}
      catch(e){if(e.status===403&&e.write){C.lector=true;D=remote;save();render();toast('Tu cuenta solo puede ver la hoja (Lector). Los cambios de este móvil no se han guardado.')}else throw e}
    }
    C.pend=0;saveC();S.last=Date.now();S.err='';S.errSt=0;S.sheetState='ok';
  }catch(e){
    S.err=e instanceof ApiError?e.message:apiMsg(0);S.errSt=e.status||0;
    if(e.status===404||(e.status===403&&!e.write)){S.sheetState='denied';renderOv()}
  }finally{S.syncing=false;renderTop();if(syncAgain){syncAgain=false;scheduleSync(300)}}
}

async function ensureTabs(id){
  const j=await api(SHEETS+id+'?fields=sheets.properties.title');const tabs=((j&&j.sheets)||[]).map(s=>s.properties.title);
  const faltan=KEYS.filter(k=>!tabs.includes(TABLAS[k][0]));
  if(faltan.length)await api(SHEETS+id+':batchUpdate',{method:'POST',body:{requests:faltan.map(k=>({addSheet:{properties:{title:TABLAS[k][0],gridProperties:{frozenRowCount:1}}}}))}},true);
}
async function checkSheet(id){
  const j=await api(SHEETS+id+'?fields=properties.title,sheets.properties.title');
  const tabs=((j&&j.sheets)||[]).map(s=>s.properties.title);
  if(!tabs.includes('Episodios')||!tabs.includes('Visitas'))throw new ApiError(400,'Esa hoja no es de Medikuak. Elige la hoja «Medikuak».');
  const faltan=KEYS.filter(k=>!tabs.includes(TABLAS[k][0]));
  try{  // escribir la cabecera de Familia comprueba si la cuenta es Editor
    if(faltan.length)await api(SHEETS+id+':batchUpdate',{method:'POST',body:{requests:faltan.map(k=>({addSheet:{properties:{title:TABLAS[k][0],gridProperties:{frozenRowCount:1}}}}))}},true);
    await api(SHEETS+id+'/values/'+rng(range('personas',1))+'?valueInputOption=RAW',{method:'PUT',body:{values:[COLS('personas')]}},true);
    C.lector=false;
  }catch(e){if(e.status===403)C.lector=true;else throw e}
  saveC();
}
async function createSheet(){
  const j=await api('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',body:{properties:{title:'Medikuak',locale:'es_ES',timeZone:'Europe/Madrid'},sheets:KEYS.map(k=>({properties:{title:TABLAS[k][0],gridProperties:{frozenRowCount:1}}}))}},true);
  const id=j.spreadsheetId;
  await api(SHEETS+id+'/values:batchUpdate',{method:'POST',body:{valueInputOption:'RAW',data:KEYS.map(k=>({range:range(k,1),values:[COLS(k)]}))}},true);
  return id;
}
/* Busca hojas «Medikuak» que esta cuenta ya puede abrir: las que creó con la app o eligió antes.
   Con el permiso drive.file, Google Drive solo devuelve esas. Necesita la Google Drive API activada. */
async function findSheets(){
  if(!tokenOk()||S.found)return;S.found='buscando';renderOv();
  try{
    const q="mimeType='application/vnd.google-apps.spreadsheet' and trashed=false and name contains 'Medikuak'";
    const j=await api('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&orderBy=modifiedTime%20desc&pageSize=10&fields='+encodeURIComponent('files(id,name,modifiedTime,ownedByMe,owners(displayName))'));
    S.found=(j&&j.files)||[];
  }catch(e){S.found=[]}
  renderOv();
}
function linkSheet(id){C.sheetId=id;C.lector=false;remoteRows={};saveC()}
async function connect(id,how){
  S.busy=how==='crear'?'Creando la hoja «Medikuak» en tu Drive…':'Conectando con la hoja…';S.err='';renderOv();
  try{
    if(how==='crear'){id=await createSheet();linkSheet(id);
      if(!live('redes').length)REDES0.forEach(([rid,nombre,h])=>D.redes.push(stamp({id:rid,nombre,h,logo:''})));save()}
    else{await checkSheet(id);if(C.sheetId!==id){C.sheetId=id;remoteRows={};saveC()}}
    S.sheetState='ok';S.busy='';render();await sync();

    s.onload=()=>gapi.load('picker',{callback:res,onerror:()=>{pickerP=null;rej(new Error('picker'))}});s.onerror=()=>{pickerP=null;rej(new Error('picker'))};document.head.appendChild(s)});

<p class="hint">Marca una persona o un episodio como privado desde su ficha. En los dispositivos que lo ocultan solo se ve después de meter el PIN.</p>
${hayPin()?`<div class="list"><button class="sw" role="switch" aria-checked="${C.lock!==false}" data-a="locksw"><span>Ocultar lo privado en este dispositivo</span><i></i></button></div>
<button class="b2" data-a="pin" data-mode="change">Cambiar el PIN</button>`:'<button class="b2" data-a="pin" data-mode="set">Crear un PIN</button>'}
<p class="meta">El PIN esconde lo privado en la app, no en la hoja: quien abra la hoja en Google Sheets con una cuenta que tenga acceso puede verlo.</p></section>
<section class="sec"><h3>Privacidad</h3><ul class="plain">
<li>Google solo deja a la app abrir los archivos que ella crea o que tú eliges en tu Drive. No ve el resto de tu Drive ni tus otras hojas.</li>
<li>Los datos de salud solo están en la hoja y en la copia de este móvil. No van en la dirección web ni en el código de la app.</li>
<li>Copia en este móvil: ${n} registros, para usarla sin conexión.</li></ul>
<button class="b2 danger" data-a="logout">${S.confirm==='logout'?'Pulsa otra vez: se borra la copia de este móvil':'Cerrar sesión y borrar la copia de este móvil'}</button>
<p class="meta">La hoja de Google no se toca: lo que ya se ha sincronizado sigue allí.</p></section>`;
}
const VIEWS={inicio:vInicio,agenda:vAgenda,familia:vFamilia,medicos:vMedicos,mas:vMas};

/* ---------- fichas (hojas que suben) ---------- */
const ADD=[['visita','Consulta','med','hecha',''],['visita','Cita','cal','cita',''],['visita','Intervención','cut','cita','intervencion'],['visita','Urgencias','warn','hecha','urgencias'],['prueba','Prueba','flask','',''],['prueba','Analítica','drop','','analitica'],['med','Fármaco','pill','',''],['tarea','Tarea','task','',''],['doc','Informe','doc','','']];
const metaLine=x=>`<p class="meta">Apuntado desde ${esc(x.por)} · ${esc(hace(x.act))}</p>`;
const medRow=r=>{const m=medi(r.medico);return `<button class="li" data-a="form" data-f="med" data-id="${r.id}">${ic('pill',20)}<div><p class="t">${esc(r.farmaco)}</p><p class="s">${esc(r.pauta)}${m?' · '+esc(m.nombre):''}</p><p class="s">${esc(epi(r.ep)?.titulo||'')}${r.fin?` · hasta ${esc(fshort(r.fin))}`:' · sin fecha de fin'}</p></div></button>`};
function epCard(e){
  const n=citas().find(c=>c.ep===e.id&&c.fecha>=HOY);
  const esps=[...new Set(live('visitas').filter(v=>v.ep===e.id).map(v=>medi(v.med)?.esp).filter(Boolean))];
  const nx=n?`<span class="next">${ic('cal',18)} ${esc(fdate(n.fecha))}${n.hora?', '+esc(n.hora):''} · ${esc(n.titulo)}</span>`
    :e.estado==='abierto'&&e.prev?`<span class="next ${e.prev<HOY?'late':'soft'}">${ic('cal',18)} Revisión prevista en ${esc(fmonth(e.prev))}${e.prev<HOY?' · atrasada':''}</span>`:'';
  return `<button class="card" data-a="open" data-k="episodios" data-id="${e.id}"><span class="t">${esc(e.titulo)}${candado('episodios',e)}</span><span class="s">${e.estado==='abierto'?'Desde':'Del'} ${esc(fshort(e.ini))}${e.fin?' al '+esc(fshort(e.fin)):''}${esps.length?' · '+esc(esps.join(', ')):''}</span>${nx}</button>`;
}
const P={};
function privBtn(k,x){
  if(k==='episodios'){const p=raw('personas',x.persona);if(p&&p.privado)return `<p class="meta">${ic('lock',14)} Privado porque ${esc(p.nombre)} está marcada como privada.</p>`}
  return x.privado?`<button class="b2" data-a="priv" data-k="${k}" data-id="${x.id}" data-v="0">${ic('lock',18)} Quitar «privado»</button><p class="meta">Se oculta en los dispositivos con PIN hasta que alguien lo meta.</p>`
    :`<button class="b2" data-a="priv" data-k="${k}" data-id="${x.id}" data-v="1">${ic('lock',18)} Marcar como privado</button>`;
}
P.pin=s=>{const d=s.d,m=s.mode;
  const t={unlock:'Ver lo privado',set:'Crear un PIN',change:'Cambiar el PIN',lockoff:'No ocultar en este dispositivo'}[m];
  const pinInp=(n,l)=>`<label class="f"><span>${l}</span><input name="${n}" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${fv(d,n)}"></label>`;
  return{title:t,body:`${m==='unlock'?'<p class="hint">Durante 5 minutos, o hasta que cierres la app, se verán las personas y episodios privados.</p>':''}
${m==='set'?'<p class="hint">Entre 4 y 8 números. Es el mismo PIN en todos los dispositivos. Sin él no se puede ver lo privado en los que lo ocultan.</p>':''}
${m==='lockoff'?'<p class="hint">Para vuestros móviles: lo privado se verá siempre en este dispositivo. En la tablet familiar, déjalo activado.</p>':''}
${m!=='set'?pinInp('pin',m==='change'?'PIN actual':'PIN'):''}${m==='set'||m==='change'?pinInp('n1','PIN nuevo')+pinInp('n2','Repite el PIN nuevo'):''}${errP(s)}
<div class="foot"><button class="b1" data-a="pinok">${m==='unlock'?'Ver':'Guardar'}</button></div>`}};
P.personas=s=>{const p=get('personas',s.id);if(!p)return null;
  const eps=live('episodios').filter(e=>e.persona===p.id),ab=eps.filter(e=>e.estado==='abierto'),ce=eps.filter(e=>e.estado!=='abierto');
  const meds=live('med').filter(r=>epi(r.ep)?.persona===p.id&&(!r.fin||r.fin>=HOY));
  return{title:p.nombre,kick:'Familia',body:`<div class="who">${av(p,56)}<p class="s">${ab.length} episodio${ab.length!==1?'s':''} abierto${ab.length!==1?'s':''} · ${meds.length} tratamiento${meds.length!==1?'s':''} en curso</p></div>
<section class="sec"><h3>Episodios abiertos</h3>${ab.map(epCard).join('')||'<p class="empty">Ninguno abierto.</p>'}<button class="add" data-a="form" data-f="episodio" data-persona="${p.id}">+ Nuevo episodio</button></section>
<section class="sec"><h3>Tratamientos en curso</h3><div class="list">${meds.map(medRow).join('')||'<p class="empty">Ninguno.</p>'}</div></section>
${ce.length?`<section class="sec"><button class="b2" data-a="closed">${S.closed?'Ocultar':'Ver'} episodios cerrados (${ce.length})</button>${S.closed?ce.map(epCard).join(''):''}</section>`:''}
<div class="foot"><button class="b2" data-a="form" data-f="persona" data-id="${p.id}">Cambiar nombre</button>${privBtn('personas',p)}</div>`}};
P.episodios=s=>{const e=get('episodios',s.id);if(!e)return null;const p=per(e.persona),abierto=e.estado==='abierto';
  const vs=live('visitas').filter(v=>v.ep===e.id),ps=live('pruebas').filter(x=>x.ep===e.id),ts=live('tareas').filter(t=>t.ep===e.id&&!t.hecha),rs=live('med').filter(r=>r.ep===e.id),ds=live('docs').filter(d=>d.ep===e.id);
  const next=citas().filter(c=>c.ep===e.id&&c.fecha>=HOY);
  const hist=[];
  vs.filter(v=>v.estado==='hecha').forEach(v=>{const m=medi(v.med);
    const ch=ps.filter(x=>x.vis===v.id).map(x=>`<span>Pidió: ${esc(x.nombre.toLowerCase())}</span>`).concat(rs.filter(r=>r.vis===v.id).map(r=>`<span>Pautó: ${esc(r.farmaco)}</span>`),ds.filter(d=>d.vis===v.id).map(d=>`<span>Informe</span>`)).join('');
    hist.push([v.fecha,`<button class="hi" data-a="open" data-k="visitas" data-id="${v.id}"><span class="rail"><i></i><b></b></span><span class="hb"><span class="s">${esc(fshort(v.fecha))} · ${tipoV(v)}</span><span class="t">${esc(vTitulo(v))}</span>${vRed(v)?`<span class="rl">${badge(vRed(v))}</span>`:''}${v.dijo?`<span class="q">${esc(v.dijo)}</span>`:''}${ch?`<span class="chips">${ch}</span>`:''}</span></button>`])});
  ps.filter(x=>(x.estado==='hecha'||x.estado==='resultado')&&x.fecha).forEach(x=>hist.push([x.fecha,`<button class="hi" data-a="open" data-k="pruebas" data-id="${x.id}"><span class="rail"><i></i><b></b></span><span class="hb"><span class="s">${esc(fshort(x.fecha))} · ${tipoP(x)}</span><span class="t">${esc(x.nombre)}</span>${x.res?`<span class="q">${esc(x.res)}</span>`:'<span class="s">Sin resultado todavía</span>'}</span></button>`]));
  /* medicación e informes que no salen de una visita también van a la línea temporal */
  const hiMed=(f,txt,r)=>[f,`<button class="hi" data-a="form" data-f="med" data-id="${r.id}"><span class="rail"><i class="m"></i><b></b></span><span class="hb"><span class="s">${esc(fshort(f))} · Medicación</span><span class="t">${txt}</span>${r.pauta?`<span class="q">${esc(r.pauta)}</span>`:''}</span></button>`];
  rs.forEach(r=>{if(r.ini&&r.ini<=HOY&&!r.vis)hist.push(hiMed(r.ini,'Empieza '+esc(r.farmaco),r));if(r.fin&&r.fin<=HOY)hist.push(hiMed(r.fin,'Deja '+esc(r.farmaco),r))});
  ds.filter(d=>!d.vis&&d.fecha).forEach(d=>hist.push([d.fecha,`<a class="hi" href="${esc(d.url)}" target="_blank" rel="noopener"><span class="rail"><i class="m"></i><b></b></span><span class="hb"><span class="s">${esc(fshort(d.fecha))} · Informe</span><span class="t">${esc(d.titulo)} ${ic('ext',16)}</span></span></a>`]));
  hist.sort((a,b)=>b[0].localeCompare(a[0]));
  hist.push(['',`<div class="hi"><span class="rail"><i class="o"></i></span><span class="hb plain"><span class="s">${esc(fshort(e.ini))} · Empieza</span>${e.notas?`<span class="q">${esc(e.notas)}</span>`:''}</span></div>`]);
  const sig=next.map(c=>rowCita(c)).join('')+ps.filter(x=>x.estado==='pedida').map(x=>`<button class="row" data-a="open" data-k="pruebas" data-id="${x.id}"><span class="txt"><span class="t">${x.esperando?'Esperando cita':'Pedir cita'}: ${esc(x.nombre)}</span><span class="s">${x.esperando?`La pediste ${esc(rel(x.esperando))}, que llamen`:tipoP(x)+' sin cita'}</span></span>${tagT(tipoP(x))}</button>`).join('')
    +ts.map(t=>tareaRow(t,true)).join('');
  return{title:e.titulo,kick:`${p.nombre} · ${abierto?'Abierto':'Cerrado'}`,body:`
${abierto&&e.prev&&!next.length?`<div class="next ${e.prev<HOY?'late':'soft'}">${ic('cal',18)} Revisión prevista en ${esc(fmonth(e.prev))}${e.prev<HOY?' · atrasada, sin cita':''}</div>`:''}
<section class="sec"><h3>Lo siguiente</h3><div class="list">${sig||'<p class="empty">Nada pendiente en este episodio.</p>'}</div></section>
${abierto?`<section class="sec"><h3>Añadir a este episodio</h3><div class="grid4">${ADD.map(([f,l,i,est,tp])=>`<button class="gbtn" data-a="form" data-f="${f}" data-ep="${e.id}" data-estado="${est}" data-tipo="${tp}">${ic(i,22)}${l}</button>`).join('')}</div></section>`:''}
<section class="sec"><h3>Historia</h3><div class="hist">${hist.map(h=>h[1]).join('')}</div></section>
${rs.length?`<section class="sec"><h3>Medicación</h3><div class="list">${rs.map(medRow).join('')}</div></section>`:''}
${ds.length?`<section class="sec"><h3>Informes</h3><div class="list">${ds.map(d=>`<a class="li" href="${esc(d.url)}" target="_blank" rel="noopener">${ic('doc',20)}<div><p class="t">${esc(d.titulo)}</p><p class="s">${esc(fshort(d.fecha))} · se abre en Google Drive</p></div>${ic('ext',18)}</a>`).join('')}</div></section>`:''}
<div class="foot">${metaLine(e)}<button class="b2" data-a="form" data-f="episodio" data-id="${e.id}">Editar episodio</button>
<button class="b2" data-a="${abierto?'cerrarEp':'abrirEp'}" data-id="${e.id}">${abierto?'Cerrar este episodio':'Reabrir este episodio'}</button>${privBtn('episodios',e)}</div>`}};
P.visitas=s=>{const v=get('visitas',s.id);if(!v)return null;const m=medi(v.med),e=epi(v.ep),p=epPer(v.ep);const c=citas().find(x=>x.id===v.id);
  const ps=live('pruebas').filter(x=>x.vis===v.id),rs=live('med').filter(r=>r.vis===v.id),ts=live('tareas').filter(t=>t.vis===v.id);
  return{title:vTitulo(v),kick:tipoV(v)+(v.estado==='cita'?' · cita':''),body:`${vRed(v)?`<div>${badge(vRed(v),true)}</div>`:''}<dl class="kv"><dt>Quién</dt><dd><button data-a="open" data-k="personas" data-id="${p.id}">${esc(p.nombre)}</button></dd>
<dt>Episodio</dt><dd><button data-a="open" data-k="episodios" data-id="${e?.id||''}">${esc(e?.titulo||'—')}</button></dd>
<dt>Cuándo</dt><dd>${esc(fdate(v.fecha))}${v.hora?', '+esc(v.hora):''} · ${esc(rel(v.fecha))}</dd><dt>Dónde</dt><dd>${esc(v.lugar||m?.centro||'—')}</dd>${v.tipo==='urgencias'&&m?`<dt>Atendió</dt><dd>${esc(m.nombre)}</dd>`:''}</dl>
${v.prep?`<section class="sec"><h3>Preparación</h3><p class="q" style="margin:0">${esc(v.prep)}</p></section>`:''}
${v.dijo?`<section class="sec"><h3>${v.tipo==='intervencion'?'Cómo fue':v.tipo==='urgencias'?'Qué pasó':'Qué dijeron'}</h3><p class="q" style="margin:0">${esc(v.dijo)}</p></section>`:''}
${ps.length+rs.length+ts.length?`<section class="sec"><h3>Salió de esta visita</h3><div class="list">${ps.map(x=>`<button class="li" data-a="open" data-k="pruebas" data-id="${x.id}">${ic('flask',20)}<div><p class="t">${esc(x.nombre)}</p><p class="s">Prueba · ${esc(x.estado)}</p></div></button>`).join('')}${rs.map(medRow).join('')}${ts.map(t=>`<div class="li">${ic('task',20)}<div><p class="t">${esc(t.texto)}</p><p class="s">${t.hecha?'Hecha':'Pendiente'}</p></div></div>`).join('')}</div></section>`:''}
<div class="foot">${v.estado==='cita'?`<button class="b1" data-a="vhecha" data-id="${v.id}">${ic('check',18)} Ya fue: apuntar qué dijeron</button>${c?`<a class="b2" href="${esc(gcal(c))}" target="_blank" rel="noopener">${ic('cal',18)} Añadir a Google Calendar</a>`:''}`:''}
${telLink(m)}<button class="b2" data-a="form" data-f="visita" data-id="${v.id}">Editar</button><button class="b2 danger" data-a="borrar" data-k="visitas" data-id="${v.id}">Borrar visita</button>${metaLine(v)}</div>`}};
const PST=[['pedida','Pedida'],['citada','Citada'],['hecha','Hecha'],['resultado','Resultado']];
P.pruebas=s=>{const x=get('pruebas',s.id);if(!x)return null;const d=s.d,i=PST.findIndex(a=>a[0]===x.estado);const c=citas().find(y=>y.id===x.id);
  return{title:x.nombre,kick:`${tipoP(x)} · ${epPer(x.ep).nombre} · ${epi(x.ep)?.titulo||''}`,body:`${x.red?`<div>${badge(x.red,true)}</div>`:''}
<div class="steps" role="group" aria-label="Estado de la prueba">${PST.map(([v,l],j)=>`<button class="st ${j<i?'done':j===i?'cur':''}" aria-pressed="${j===i}" data-a="pestado" data-id="${x.id}" data-v="${v}"><span class="c">${j<i?ic('check',14):''}</span>${l}</button>`).join('')}</div>
${x.estado!=='pedida'?`<div class="two">${inp(d,'fecha','Fecha','date')}${inp(d,'hora','Hora','time')}</div>${sel(d,'red','Dónde: red de salud',redOpts())}${inp(d,'lugar','Centro')}`:`${x.esperando?`<div class="next soft">${ic('phone',18)} La pediste ${esc(rel(x.esperando))}. Esperando que llamen.</div>`:`<button class="choice" data-a="pespera" data-id="${x.id}">${ic('phone',28)}<span><span class="t">La he pedido, me llamarán</span><br><span class="s">Pasa a «Esperando que te llamen». No cuenta como atrasado.</span></span></button>`}<p class="hint">Cuando te den cita, pulsa «Citada» y apunta fecha, hora y lugar.</p>`}
${x.estado==='citada'?ta(d,'prep','Preparación','Ayunas, llegar antes…'):''}
${x.estado==='hecha'||x.estado==='resultado'?ta(d,'res','Resultado','Qué dice el informe'):''}
${s.err?`<p class="ferr">${esc(s.err)}</p>`:''}
<div class="foot">${x.estado!=='pedida'?'<button class="b1" data-a="save">Guardar</button>':''}
${c?`<a class="b2" href="${esc(gcal(c))}" target="_blank" rel="noopener">${ic('cal',18)} Añadir a Google Calendar</a>`:''}
<button class="b2 danger" data-a="borrar" data-k="pruebas" data-id="${x.id}">Borrar prueba</button>${metaLine(x)}</div>`}};

  const ps=[...new Set(live('visitas').filter(v=>v.med===m.id).map(v=>epPer(v.ep).nombre))];
  return{title:m.nombre,kick:m.esp,body:`${m.red?`<div>${badge(m.red,true)}</div>`:''}<dl class="kv"><dt>Centro</dt><dd>${esc(m.centro||'—')}</dd><dt>Teléfono</dt><dd>${esc(m.tel||'—')}</dd><dt>Atiende a</dt><dd>${esc(ps.join(', ')||'—')}</dd>${m.notas?`<dt>Notas</dt><dd>${esc(m.notas)}</dd>`:''}</dl>

P.pedircita=s=>{const t=get('tareas',s.id);if(!t)return null;const m=medi(t.med);
  return{title:t.texto,kick:`${epPer(t.ep).nombre} · ${epi(t.ep)?.titulo||''}`,body:`${t.esperando?`<div class="next soft">${ic('phone',18)} La pediste ${esc(rel(t.esperando))}. Esperando que llamen.</div>`:''}

${t.esperando?'':`<button class="choice" data-a="tespera" data-id="${t.id}">${ic('phone',28)}<span><span class="t">La he pedido, me llamarán</span><br><span class="s">Sale de «Por hacer» y pasa a «Esperando que te llamen». No cuenta como atrasado.</span></span></button>`}

P.nuevo=()=>({title:'Añadir',body:`<div class="grid4">${[['visita','Consulta que ya fue','med','hecha',''],['visita','Cita','cal','cita',''],['visita','Intervención','cut','cita','intervencion'],['visita','Urgencias','warn','hecha','urgencias'],['prueba','Prueba','flask','',''],['prueba','Analítica','drop','','analitica'],['tarea','Tarea','task','',''],['med','Medica­mento','pill','',''],['episodio','Episodio','doc','','']].map(([f,l,i,e,tp])=>`<button class="gbtn" data-a="form" data-f="${f}" data-estado="${e}" data-tipo="${tp}">${ic(i,22)}${l}</button>`).join('')}</div>

<section class="sec"><h3>En el otro móvil</h3><ol class="plain"><li>Escanea el QR o abre el enlace.</li><li>Entra con la cuenta de Google que vaya a usar la app.</li><li>Si es una cuenta distinta de la que creó la hoja, elige la hoja «Medikuak» en su Drive cuando la app lo pida. Es una sola vez: así Google da permiso a la app solo para ese archivo.</li><li>Pon nombre al móvil.</li></ol></section>
<div class="banner">${ic('lock',18)}<span>El enlace solo dice qué hoja usar, no da acceso. La hoja tiene que estar compartida con esa cuenta: Editor para cambiar, Lector solo para ver.</span></div>`});

/* ---------- formularios ---------- */
const fv=(d,n)=>esc(d[n]??'');
const inp=(d,n,l,type='text',ph='')=>`<label class="f"><span>${l}</span><input name="${n}" type="${type}" value="${fv(d,n)}"${ph?` placeholder="${esc(ph)}"`:''}></label>`;
const ta=(d,n,l,ph='')=>`<label class="f"><span>${l}</span><textarea name="${n}" rows="3"${ph?` placeholder="${esc(ph)}"`:''}>${fv(d,n)}</textarea></label>`;
const sel=(d,n,l,opts)=>`<label class="f"><span>${l}</span><select name="${n}" data-rr="1">${opts.map(([v,t])=>`<option value="${esc(v)}"${d[n]===v?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`;

function epField(s){

function initDraft(s){
  const d={};const f=s.t.slice(5);
  if(f==='visita'){if(s.id){const v=get('visitas',s.id);Object.assign(d,{tipo:v.tipo||'',red:v.red||'',lugar:v.lugar||'',estado:v.estado,ep:v.ep,persona:epi(v.ep)?.persona,med:v.med,fecha:v.fecha,hora:v.hora,prep:v.prep||'',dijo:v.dijo})}
    else{d.tipo=s.tipo||'';d.estado=s.estado||'hecha';d.fecha=d.estado==='hecha'?HOY:'';d.hora='';const last=s.ep&&live('visitas').filter(v=>v.ep===s.ep).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];if(last)d.med=last.med}}
  if(f==='prueba'){d.estado='pedida';d.tipo=s.tipo||'';const v=s.ep&&live('visitas').filter(x=>x.ep===s.ep).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];d.red=(v&&medi(v.med)?.red)||''}
  if(f==='red'){if(s.id){const r=get('redes',s.id);Object.assign(d,{nombre:r.nombre,h:r.h,logo:r.logo})}else d.h='r4'}
  if(f==='med'){if(s.id){const r=get('med',s.id);Object.assign(d,{farmaco:r.farmaco,pauta:r.pauta,medico:r.medico,ini:r.ini,fin:r.fin})}else d.ini=HOY}
  if(f==='episodio'){if(s.id){const e=get('episodios',s.id);Object.assign(d,{persona:e.persona,titulo:e.titulo,prev:e.prev,notas:e.notas})}else d.persona=s.persona||S.pf||live('personas')[0]?.id}
  if(f==='medico'&&s.id){const m=get('medicos',s.id);Object.assign(d,{nombre:m.nombre,esp:m.esp,red:m.red||'',centro:m.centro,tel:m.tel,notas:m.notas})}
  if(f==='persona'&&s.id)d.nombre=get('personas',s.id).nombre;
  return d;
}
function mkEp(s){const d=s.d;if(s.ep)return s.ep;if(d.ep!=='__new')return d.ep;
  const e=stamp({id:uid(),persona:d.persona,titulo:d.epNuevo.trim(),estado:'abierto',ini:HOY,fin:'',prev:'',notas:''});D.episodios.push(e);return e.id}
function mkMed(d,n){if(d[n]!=='__new')return d[n]||'';const m=stamp({id:uid(),nombre:d.mNombre.trim(),esp:(d.mEsp||'').trim()||'Sin especialidad',red:d.mRed||'',centro:'',tel:'',notas:''});D.medicos.push(m);return m.id}
function saveForm(s){
  const d=s.d,f=s.t,T=x=>String(x??'').trim();
  const fail=m=>{s.err=m;renderSheets();return false};
  const epOk=()=>s.ep||(d.persona&&(d.ep!=='__new'||T(d.epNuevo)));
  const close=()=>{S.sheets.pop();};
  if(f==='pruebas'){const x=get('pruebas',s.id);if(x.estado==='citada'&&!d.fecha)return fail('Pon la fecha de la cita');
    close();return write(()=>{Object.assign(x,{fecha:d.fecha||'',hora:d.hora||'',red:d.red||'',lugar:T(d.lugar),prep:T(d.prep),res:T(d.res)});stamp(x)},'Prueba guardada')}
  if(f==='form-red'){if(!T(d.nombre))return fail('Escribe el nombre');
    close();return write(()=>{const o={nombre:T(d.nombre),h:d.h||'r4',logo:d.logo||''};if(s.id)stamp(Object.assign(get('redes',s.id),o));else D.redes.push(stamp(Object.assign({id:uid()},o)))},'Red de salud guardada')}
  if(f==='form-visita'){
    if(!epOk())return fail('Escribe el nombre del episodio nuevo');
    if(d.med==='__new'&&!T(d.mNombre))return fail('Escribe el nombre del médico');
    if(d.tipo!=='urgencias'&&!d.med)return fail('Elige el médico');
    if(d.tipo==='urgencias'&&d.fecha>HOY)return fail('Las urgencias se apuntan cuando ya han pasado');
    if(!d.fecha)return fail('Pon la fecha');if(d.estado==='cita'&&!d.hora)return fail('Pon la hora de la cita');
    if(d.estado==='cita'&&d.fecha<HOY)return fail('Una cita futura no puede tener fecha pasada');
    close();return write(()=>{const ep=mkEp(s),m=mkMed(d,'med');
      if(s.id){const v=get('visitas',s.id);Object.assign(v,{ep,tipo:d.tipo||'',med:m,red:d.tipo==='urgencias'?d.red||'':'',lugar:d.tipo==='urgencias'?T(d.lugar):'',fecha:d.fecha,hora:d.hora||'',estado:d.estado,prep:d.tipo==='intervencion'?T(d.prep):'',dijo:T(d.dijo)});stamp(v)}
      else{const v=stamp({id:uid(),ep,tipo:d.tipo||'',med:m,red:d.tipo==='urgencias'?d.red||'':'',lugar:d.tipo==='urgencias'?T(d.lugar):'',fecha:d.fecha,hora:d.hora||'',estado:d.estado,prep:d.tipo==='intervencion'&&d.estado==='cita'?T(d.prep):'',dijo:d.estado==='hecha'?T(d.dijo):''});D.visitas.push(v);
        if(d.estado==='hecha'){lines(d.pruebas).forEach(t=>D.pruebas.push(stamp({id:uid(),ep,vis:v.id,nombre:t,estado:'pedida',fecha:'',hora:'',lugar:'',prep:'',res:''})));
          if(T(d.farmaco))D.med.push(stamp({id:uid(),ep,vis:v.id,medico:m,farmaco:T(d.farmaco),pauta:T(d.pauta),ini:d.fecha,fin:''}))}
        lines(d.tareas).forEach(t=>D.tareas.push(stamp({id:uid(),ep,vis:v.id,texto:t,tipo:esCita(t)?'cita':'',med:esCita(t)?m:'',esperando:'',hecha:false})));
        if(s.fromTask){const t=get('tareas',s.fromTask);if(t){t.hecha=true;t.cita=v.id;stamp(t)}}}},s.id?'Guardado':s.fromTask?'Cita apuntada y tarea cerrada':d.tipo==='urgencias'?'Urgencias guardadas':d.tipo==='intervencion'?'Intervención apuntada':d.estado==='cita'?'Cita apuntada':'Consulta guardada')}
  if(f==='form-prueba'){if(!epOk())return fail('Escribe el nombre del episodio nuevo');if(!T(d.nombre)&&d.tipo!=='analitica')return fail('Escribe qué prueba es');if(d.estado==='citada'&&!d.fecha)return fail('Pon la fecha de la cita');
    close();return write(()=>{D.pruebas.push(stamp({id:uid(),ep:mkEp(s),vis:'',tipo:d.tipo||'',nombre:T(d.nombre)||'Analítica',estado:d.estado,fecha:d.estado==='citada'?d.fecha:'',hora:d.estado==='citada'?d.hora||'':'',red:d.red||'',lugar:T(d.lugar),prep:T(d.prep),res:''}))},d.tipo==='analitica'?'Analítica apuntada':'Prueba apuntada')}
  if(f==='form-tarea'){if(!epOk())return fail('Escribe el nombre del episodio nuevo');if(!T(d.texto))return fail('Escribe la tarea');
    if(d.med==='__new'&&!T(d.mNombre))return fail('Escribe el nombre del médico');
    close();return write(()=>{D.tareas.push(stamp({id:uid(),ep:mkEp(s),vis:'',texto:T(d.texto),tipo:d.tipo||'',med:d.tipo==='cita'?mkMed(d,'med'):'',esperando:'',hecha:false}))},'Tarea apuntada')}
  if(f==='form-med'){if(!s.id&&!epOk())return fail('Escribe el nombre del episodio nuevo');if(!T(d.farmaco))return fail('Escribe el medicamento');if(d.medico==='__new'&&!T(d.mNombre))return fail('Escribe el nombre del médico');
    close();return write(()=>{const m=mkMed(d,'medico');if(s.id){const r=get('med',s.id);Object.assign(r,{farmaco:T(d.farmaco),pauta:T(d.pauta),medico:m,ini:d.ini||'',fin:d.fin||''});stamp(r)}
      else D.med.push(stamp({id:uid(),ep:mkEp(s),vis:'',medico:m,farmaco:T(d.farmaco),pauta:T(d.pauta),ini:d.ini||HOY,fin:d.fin||''}))},'Medicamento guardado')}
  if(f==='form-doc'){if(!epOk())return fail('Escribe el nombre del episodio nuevo');if(!T(d.titulo))return fail('Pon un nombre al informe');if(!/^https:\/\/(drive|docs)\.google\.com\//.test(T(d.url)))return fail('Pega un enlace de Google Drive (empieza por https://drive.google.com/)');
    close();return write(()=>{D.docs.push(stamp({id:uid(),ep:mkEp(s),vis:'',titulo:T(d.titulo),url:T(d.url),fecha:HOY}))},'Informe añadido')}
  if(f==='form-episodio'){if(!d.persona)return fail('Primero añade a alguien de la familia');if(!T(d.titulo))return fail('Pon un nombre al episodio');
    close();return write(()=>{if(s.id){const e=get('episodios',s.id);Object.assign(e,{persona:d.persona,titulo:T(d.titulo),prev:d.prev||'',notas:T(d.notas)});stamp(e)}
      else{const e=stamp({id:uid(),persona:d.persona,titulo:T(d.titulo),estado:'abierto',ini:HOY,fin:'',prev:d.prev||'',notas:T(d.notas)});D.episodios.push(e);S.sheets.push({t:'episodios',id:e.id,d:{}});S.anim=S.sheets.length-1}},s.id?'Episodio guardado':'Episodio creado')}
  if(f==='form-medico'){if(!T(d.nombre)||!T(d.esp))return fail('Pon nombre y especialidad');
    close();return write(()=>{const o={nombre:T(d.nombre),esp:T(d.esp),red:d.red||'',centro:T(d.centro),tel:T(d.tel),notas:T(d.notas)};if(s.id)stamp(Object.assign(get('medicos',s.id),o));else D.medicos.push(stamp(Object.assign({id:uid()},o)))},'Médico guardado')}
  if(f==='form-persona'){if(!T(d.nombre))return fail('Escribe el nombre');
    close();return write(()=>{if(s.id)stamp(Object.assign(get('personas',s.id),{nombre:T(d.nombre)}));else D.personas.push(stamp({id:uid(),nombre:T(d.nombre),h:live('personas').length%5+1}))},'Familiar guardado')}
}

function renderSheets(){
  const out=[];S.sheets=S.sheets.filter(s=>P[s.t]);
  S.sheets.forEach((s,i)=>{const r=P[s.t](s);if(!r){return}
    out.push(`<div class="scrim" data-a="close" style="z-index:${40+i*2}"></div><section class="sheet${S.anim===i?' in':''}" role="dialog" aria-modal="true" aria-label="${esc(r.title)}" style="z-index:${41+i*2}"><div class="grab" aria-hidden="true"></div><div class="sh"><h2>${r.kick?`<span class="k">${esc(r.kick)}</span>`:''}${esc(r.title)}</h2><button class="x" data-a="close" aria-label="Cerrar">${ic('x',22)}</button></div>${r.body}</section>`)});
  $('#sheets').innerHTML=out.join('');S.anim=-1;if($('#qrbox'))makeQr();
  document.body.style.overflow=S.sheets.length?'hidden':'';
}

<button class="b1" data-a="login">Entrar con Google</button>${err}`;
  if(!C.sheetId&&Array.isArray(S.found)&&S.found.length)return `<h2>Ya tienes la hoja de la familia</h2><p class="small">Cuenta: ${esc(auth.email)}</p>
${S.found.map(f=>`<button class="choice" data-a="usar" data-id="${esc(f.id)}">${ic('sheet',28)}<span><span class="t">Usar «${esc(f.name)}»</span><br><span class="s">${f.ownedByMe?'En tu Drive':'De '+esc((f.owners&&f.owners[0]&&f.owners[0].displayName)||'otra cuenta')} · cambiada ${esc(fshort((f.modifiedTime||'').slice(0,10)))}</span></span></button>`).join('')}
${err}<button class="b2" data-a="nuevaigual">Crear otra hoja nueva</button><button class="b2" data-a="otra">Usar otra cuenta</button>`;
  if(!C.sheetId&&S.found==='buscando')return `${MARK}<h2>Buscando tu hoja…</h2>`;
  if(!C.sheetId)return `<h2>¿Es la primera vez en la familia?</h2><p class="small">Cuenta: ${esc(auth.email)}</p>
<button class="choice" data-a="crear">${ic('sheet',28)}<span><span class="t">Crear la hoja de la familia</span><br><span class="s">Se crea «Medikuak» en tu Drive. Luego la compartes con quien quieras.</span></span></button>
<button class="choice" data-a="picker">${ic('join',28)}<span><span class="t">Unirme a la hoja que ya usa alguien</span><br><span class="s">Tienen que habértela compartido. La eliges en tu Drive (o abre el enlace o QR de su móvil).</span></span></button>
${err}<button class="b2" data-a="otra">Usar otra cuenta</button>`;
  if(S.sheetState==='denied')return `${ic('lock',48)}<h2>Esta cuenta no puede abrir la hoja</h2><p><b>${esc(auth.email)}</b> no tiene la hoja compartida, o todavía no la ha elegido en su Drive.</p>
<ol class="plain"><li>Pide a quien la creó que la comparta con esta cuenta (en Google Sheets, botón Compartir).</li><li>Después pulsa «Elegir la hoja en mi Drive».</li></ol>
<button class="b1" data-a="picker">Elegir la hoja en mi Drive</button><button class="b2" data-a="otra">Usar otra cuenta</button><button class="b2" data-a="otrahoja">Crear o elegir otra hoja</button>${err}`;
  if(!tokenOk()&&!S.last&&!live('personas').length)return `${MARK}<h2>Entra de nuevo con Google</h2><p>La sesión ha caducado antes de terminar de conectar la hoja.</p><button class="b1" data-a="relogin">Entrar con Google</button>`;
  if(!C.device)return `<h2>¿Cómo llamamos a este móvil?</h2><p>Así veréis quién apuntó cada cosa.</p><label class="f"><span>Nombre del móvil</span><input id="devIn" value="${esc(auth.name?'Móvil de '+auth.name:'')}" maxlength="30" placeholder="Móvil de Ana"></label><button class="b1" data-a="empezar">Empezar</button>`;
  return '';
}
function renderOv(){const o=$('#ov'),h=ovHTML();if(!h){o.hidden=true;o.innerHTML='';return}o.hidden=false;o.innerHTML=`<div class="onb">${h}</div>`}
function render(){
  renderTop();renderPf();$('#main').innerHTML=VIEWS[S.tab]();
  $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-a="tab" data-v="${k}"${S.tab===k?' aria-current="page"':''}>${ic(i,24)}${l}</button>`).join('');
  $('#fab').innerHTML=ic('plus',28);renderSheets();renderOv();renderToast();
}
function push(s){s.d=s.d||{};S.sheets.push(s);S.anim=S.sheets.length-1;if(s.t.startsWith('form-'))s.d=initDraft(s);renderSheets();
  const f=$('#sheets section:last-of-type input:not([type=date]):not([type=time]), #sheets section:last-of-type textarea');if(f&&s.t.startsWith('form-')&&!s.id)setTimeout(()=>f.focus({preventScroll:true}),280)}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,top=S.sheets[S.sheets.length-1];S.confirm=a===S.confirm?S.confirm:(['logout','reset'].includes(a)?S.confirm:'');
  if(a==='tab'){S.tab=el.dataset.v;S.sheets=[];window.scrollTo(0,0);render()}
  else if(a==='pf'){S.pf=el.dataset.v;render()}
  else if(a==='close'){S.sheets.pop();renderSheets()}
  else if(a==='open'){const k=el.dataset.k;if(!id&&k!=='dispositivos')return;let d={};if(k==='pruebas'){const x=get('pruebas',id);d={fecha:x.fecha,hora:x.hora,lugar:x.lugar,prep:x.prep,res:x.res}}push({t:k,id,d})}
  else if(a==='nuevo'){if(C.lector)return toast('Solo lectura: tu cuenta es Lector en esta hoja.');push({t:'nuevo'})}
  else if(a==='form'){if(C.lector)return toast('Solo lectura: tu cuenta es Lector en esta hoja.');
    if(top&&top.t==='nuevo')S.sheets.pop();push({t:'form-'+el.dataset.f,id,ep:el.dataset.ep||'',estado:el.dataset.estado||'',tipo:el.dataset.tipo||'',persona:el.dataset.persona||''})}
  else if(a==='dset'){top.d[el.dataset.n]=el.dataset.v;if(el.dataset.n==='persona')delete top.d.ep;top.err='';renderSheets()}
  else if(a==='save')saveForm(top);
  else if(a==='undo'){const u=S.toast&&S.toast.undo;S.toast=null;if(u)u();else renderToast()}
  else if(a==='tarea'){ev.preventDefault();const t=get('tareas',id);if(t.tipo==='cita'){if(C.lector)return toast('Solo lectura: tu cuenta es Lector en esta hoja.');push({t:'pedircita',id});return}write(()=>{t.hecha=true;stamp(t)},`Hecho: ${t.texto}`)}
  else if(a==='vhecha'){const v=get('visitas',id);if(write(()=>{v.estado='hecha';stamp(v)},'Visita marcada como hecha')){S.sheets=S.sheets.filter(s=>!(s.t==='visitas'&&s.id===id));push({t:'form-visita',id})}}
  else if(a==='pestado'){const x=get('pruebas',id),v=el.dataset.v;if(x.estado===v)return;write(()=>{x.estado=v;if(v==='hecha'&&!x.fecha)x.fecha=HOY;stamp(x)},`${x.nombre}: ${PST.find(p=>p[0]===v)[1].toLowerCase()}`);const d=top.d;d.fecha=x.fecha;d.hora=x.hora;renderSheets()}
  else if(a==='borrar'){const k=el.dataset.k,x=get(k,id);S.sheets.pop();write(()=>{x.borrado=Date.now();stamp(x)},{visitas:'Visita borrada',pruebas:'Prueba borrada',medicos:'Médico borrado',med:'Medicamento borrado'}[k])}
  else if(a==='cerrarEp'||a==='abrirEp'){const e=get('episodios',id);write(()=>{Object.assign(e,a==='cerrarEp'?{estado:'cerrado',fin:HOY}:{estado:'abierto',fin:''});stamp(e)},a==='cerrarEp'?`Episodio cerrado: ${e.titulo}`:'Episodio reabierto')}
  else if(a==='tcita'){if(C.lector)return toast('Solo lectura: tu cuenta es Lector en esta hoja.');const t=get('tareas',id);if(top&&top.t==='pedircita')S.sheets.pop();push({t:'form-visita',ep:t.ep,estado:'cita',fromTask:t.id});const n=S.sheets[S.sheets.length-1];if(t.med){n.d.med=t.med;renderSheets()}}
  else if(a==='pedir')push({t:'pedircita',id});
  else if(a==='tespera'){const t=get('tareas',id);S.sheets.pop();write(()=>{t.esperando=HOY;stamp(t)},'Apuntado: esperando que te llamen')}
  else if(a==='thecha'){const t=get('tareas',id);S.sheets.pop();write(()=>{t.hecha=true;stamp(t)},`Hecho: ${t.texto}`)}
  else if(a==='pespera'){const x=get('pruebas',id);write(()=>{x.esperando=HOY;stamp(x)},'Apuntado: esperando que te llamen')}
  else if(a==='closed'){S.closed=!S.closed;renderSheets()}
  else if(a==='copy'){const l=shareLink();try{navigator.clipboard.writeText(l).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar: cópialo a mano'))}catch(e){toast('No se pudo copiar: cópialo a mano')}}
  else if(a==='devname'){const v=$('#devname').value.trim();if(!v)return toast('Escribe un nombre');C.device=v.slice(0,30);saveC();toast('Nombre guardado');render()}
  else if(a==='logout'){if(S.confirm!=='logout'){S.confirm='logout';render();return}logout()}
  else if(a==='login')signIn(auth&&auth.email?'auto':'select');
  else if(a==='relogin')signIn('auto');
  else if(a==='otra')signIn('select');
  else if(a==='crear')connect('','crear');
  else if(a==='picker')openPicker();
  else if(a==='otrahoja'){C.sheetId='';S.sheetState='';S.err='';S.found=null;saveC();render();findSheets()}
  else if(a==='usar')connect(id,'unir');
  else if(a==='nuevaigual'){S.found=[];renderOv()}
  else if(a==='syncnow'){sync().then(()=>{toast(S.err||'Sincronizado');render()})}
  else if(a==='recheck'){checkSheet(C.sheetId).then(()=>{render();toast(C.lector?'Sigues siendo Lector en esta hoja':'Ya puedes cambiar cosas');sync()},e=>toast(e.message))}
  else if(a==='unlock')push({t:'pin',mode:'unlock'});
  else if(a==='relock'){S.unlockUntil=Date.now()-1;relock();toast('Lo privado vuelve a estar oculto')}
  else if(a==='pin'){if(C.lector)return toast(LECTOR);push({t:'pin',mode:el.dataset.mode})}
  else if(a==='locksw'){if(C.lock!==false)push({t:'pin',mode:'lockoff'});else{C.lock=true;saveC();render();toast('Lo privado se oculta en este dispositivo')}}
  else if(a==='pinok')pinSubmit(top);
  else if(a==='priv'){const k=el.dataset.k,x=get(k,id),on=el.dataset.v==='1';
    if(on&&!hayPin()){toast('Primero crea un PIN');push({t:'pin',mode:'set'});return}
    if(write(()=>{x.privado=on;stamp(x)},on?'Marcado como privado':'Ya no es privado')&&on&&locked()){S.sheets=[];render()}}
  else if(a==='empezar'){const v=($('#devIn').value||'').trim();if(!v){$('#devIn').focus();return}C.device=v.slice(0,30);saveC();S.tab='inicio';render();sync()}
});
async function pinSubmit(s){
  const d=s.d,fail=m=>{s.err=m;renderSheets()},ok4=v=>/^\d{4,8}$/.test(v||'');
  if(s.mode!=='set'&&!(await pinOk(d.pin||'')))return fail('PIN incorrecto');
  if(s.mode==='unlock'){S.sheets.pop();S.unlockUntil=Date.now()+5*60000;render();return toast('Se ve lo privado durante 5 minutos')}
  if(s.mode==='lockoff'){S.sheets.pop();C.lock=false;saveC();render();return toast('Lo privado se ve siempre en este dispositivo')}
  if(!ok4(d.n1))return fail('El PIN nuevo tiene que tener entre 4 y 8 números');
  if(d.n1!==d.n2)return fail('Los dos PIN nuevos no coinciden');
  const v=await pinNuevo(d.n1);S.sheets.pop();
  write(()=>{const r=raw('ajustes','pin');if(r){r.valor=v;stamp(r)}else D.ajustes.push(stamp({id:'pin',valor:v}))},s.mode==='set'?'PIN creado':'PIN cambiado');
}
function onField(ev){
  const t=ev.target;
  if(t.id==='q'){S.q=t.value;$('#mlist').innerHTML=medList();return}
  const top=S.sheets[S.sheets.length-1];if(!top||!t.name||!t.closest('.sheet'))return;
  if(t.type==='file'){if(ev.type!=='change'||!t.files[0])return;toLogo(t.files[0]).then(u=>{top.d.logo=u;renderSheets()},()=>{top.err='No se pudo leer esa imagen. Prueba con un PNG o JPG.';renderSheets()});return}
  top.d[t.name]=t.value;if(top.err){top.err='';const e=t.closest('.sheet').querySelector('.ferr');if(e)e.remove()}
  if(ev.type==='change'&&t.dataset.rr)renderSheets();
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheets.length){S.sheets.pop();renderSheets()}});

async function startup(){
  await loadAll();
  const ret=await handleOAuthReturn();
  const hm=location.hash.match(/^#hoja=([A-Za-z0-9_-]{20,})/);
  if(hm){if(C.sheetId!==hm[1]){C.sheetId=hm[1];C.lector=false;remoteRows={};saveC()}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  render();
  if(ret&&ret.error){
    if(ret.error!=='state'&&!/interaction_required|login_required|consent_required|account_selection_required/.test(ret.error)){S.err=ret.error==='access_denied'?'No se ha dado permiso a la app en Google.':'Google no ha dejado entrar ('+ret.error+').';render()}
    return;
  }
  if(!ret&&auth&&auth.email&&!tokenOk()&&configured()&&navigator.onLine!==false){   // renovar la sesión sin preguntar, como mucho cada 2 minutos
    let last=0;try{last=+(localStorage.getItem(LS('silent'))||0)}catch(e){}
    if(Date.now()-last>120000){try{localStorage.setItem(LS('silent'),String(Date.now()))}catch(e){}signIn('none');return}
  }
  if(auth&&auth.email&&tokenOk()&&!C.sheetId)findSheets();
  if(linked()&&tokenOk()){
    if((ret&&ret.ok)||hm){
      try{await checkSheet(C.sheetId);S.sheetState='ok'}
      catch(e){S.err=e.message;if(e.status===403||e.status===404)S.sheetState='denied';render();return}
    }
    await sync();render();
  }
}
startup();
}
